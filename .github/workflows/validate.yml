name: Validate Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate node files exist and non-empty
        shell: bash
        run: |
          set -e
          required="debounce extract-payload build-claude-payload process-response send-response"
          for n in $required; do
            f="nodes/$n.js"
            [ -s "$f" ] || { echo "MISSING or empty: $f"; exit 1; }
            echo "OK $f"
          done

      - name: Validate workflows JSON
        shell: bash
        run: |
          set -e
          for f in workflows/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
            echo "OK $f"
          done

      - name: Validate migrations SQL
        shell: bash
        run: |
          set -e
          for n in 001_protected_contacts 002_enable_rls 003_message_audit; do
            f="migrations/$n.sql"
            [ -s "$f" ] || { echo "MISSING: $f"; exit 1; }
            grep -qE 'CREATE TABLE|CREATE INDEX|ALTER' "$f" || { echo "$f has no DDL"; exit 1; }
            echo "OK $f"
          done

      - name: README integrity
        shell: bash
        run: |
          for section in nodes migrations prompts docs; do
            grep -q "$section/" README.md || { echo "README missing reference to $section/"; exit 1; }
          done
          echo "All sections referenced."
